---
layout: default
---
<article class="prose post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="post-date">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>
  {{ content }}
</article>
